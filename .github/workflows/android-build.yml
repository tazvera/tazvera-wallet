name: Android debug APK

on:
  push:
    branches:
      - android/pwa-install-readiness-2026-11
  pull_request:
    branches:
      - security/pin-and-keystore-hardening-2026-11
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install pinned Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare bundled wallet files
        run: npm run android:prepare

      - name: Generate Android project
        run: npx cap add android

      - name: Configure QR camera permission
        run: npm run android:configure

      - name: Sync Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: tazvera-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
