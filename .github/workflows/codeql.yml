name: CodeQL
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          config: |
            paths-ignore:
              - ethers.min.js
              - qrcode.min.js
              - jsqr.js
              - web/**
      - uses: github/codeql-action/analyze@v3
