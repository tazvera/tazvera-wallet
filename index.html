
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://assets.coingecko.com; font-src 'self' data:; connect-src 'self' https://api-mezame.shardeum.org https://api.shardeum.org https://explorer-mezame.shardeum.org https://explorer.shardeum.org https://data-seed-prebsc-1-s1.bnbchain.org:8545 https://bsc-testnet-rpc.publicnode.com https://ethereum-sepolia-rpc.publicnode.com https://sepolia.drpc.org https://api.coingecko.com https://open.er-api.com https://widget.houdiniswap.com; frame-src 'self' https://widget.houdiniswap.com; object-src 'none'; base-uri 'self'">
<title>Tazvera · Simple crypto wallet</title>
<meta name="theme-color" content="#F5F7FA">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="app/css/fonts.css">
<link rel="stylesheet" href="app/css/app.css">
<style>
/* Tazvera Swap Modal Styles */
#tazveraSwapOverlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.6);
    z-index: 99998;
    backdrop-filter: blur(3px);
}

#tazveraSwap {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90%;
    max-width: 450px;
    height: 85%;
    max-height: 700px;
    background-color: #0B1D3A;
    z-index: 99999;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0px 10px 30px rgba(0,0,0,0.8);
    overflow: hidden;
}

#tazveraSwap iframe {
    width: 100%;
    height: calc(100% - 50px);
    border: none;
    border-radius: 0 0 20px 20px;
}

.swap-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 20px;
    background-color: #16335F;
    border-bottom: 1px solid rgba(255,255,255,0.05);
}

.swap-title {
    color: white;
    font-weight: 600;
    font-size: 18px;
    font-family: inherit;
}

.close-swap-btn {
    background: rgba(255,255,255,0.1);
    color: white;
    border: none;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
}
</style>
</head>
<body>
<div id="app"></div>

<!-- Tazvera Swap Modal (Pop-up) -->
<div id="tazveraSwapOverlay" onclick="closeTazveraSwap()"></div>
<div id="tazveraSwap">
    <div class="swap-header">
        <span class="swap-title">Swap Tokens</span>
        <button class="close-swap-btn" onclick="closeTazveraSwap()">✕</button>
    </div>
    <iframe src="https://widget.houdiniswap.com/?theme=dark"></iframe>
</div>

<div class="sheetbg" id="sbg"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<!-- libraries (shared with the classic app) -->
<script src="ethers.min.js"></script>
<script src="wallet.js"></script>
<script src="qrcode.min.js"></script>

<!-- Tazvera app: loaded in order -->
<script src="app/js/00-config.js"></script>
<script src="app/js/01-i18n.js"></script>
<script src="app/js/02-core.js"></script>
<script src="app/js/10-send.js"></script>
<script src="app/js/11-scan.js"></script>
<script src="app/js/12-request.js"></script>
<script src="app/js/13-lock-onboarding.js"></script>
<script src="app/js/20-faucet-security.js"></script>
<script src="app/js/21-tools.js"></script>
<script src="app/js/22-wallets-help-backup.js"></script>
<script src="app/js/23-back-button.js"></script>
<script src="app/js/24-explore.js"></script>
<script src="app/js/25-settings.js"></script>
<script src="app/js/30-render-boot.js"></script>

<!-- Tazvera Swap Script -->
<script>
    function openTazveraSwap() {
        document.getElementById('tazveraSwap').style.display = 'block';
        document.getElementById('tazveraSwapOverlay').style.display = 'block';
    }
    
    function closeTazveraSwap() {
        document.getElementById('tazveraSwap').style.display = 'none';
        document.getElementById('tazveraSwapOverlay').style.display = 'none';
    }

    // Since your app generates buttons dynamically via JS (e.g., app/js/30-render-boot.js),
    // you need to add this function to be called from your JS files.
    // In your JS where you render the "Send", "Receive" buttons, you can now add:
    // <button onclick="openTazveraSwap()">Swap</button>
    
    // We make it globally available:
    window.openTazveraSwap = openTazveraSwap;
</script>
</body>
</html>
